services:
  server:
    build: .
    environment:
      - HOST=${HOST}
      - PORT=${PORT}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - HASH_COST=${HASH_COST}
    volumes:
      - .:/linkshorteningservice
    networks:
      - net
    depends_on:
      - db

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  db:
    image: postgres:latest
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
    networks:
      - net
    volumes:
      - ./pgdata:/var/lib/postgresql/18/data

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx
    ports:
      - "80:80"
    networks:
      - net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web/URLShortener:/usr/share/nginx/html:ro
    depends_on:
      - server
  
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"


networks:
  net:
    driver: bridge