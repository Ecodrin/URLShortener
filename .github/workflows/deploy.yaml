name: CI/CD PipeLine


on:
  push:
    branches:
    - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: deploy
      run: |
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
        chmod 600 key.pem

        tar -czvf ${{ secrets.PROJECT_FOLDER }}.zip .
        scp -i key.pem ${{ secrets.PROJECT_FOLDER }}.zip ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/
        ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          rm -rf ${{ secrets.PROJECT_FOLDER }}
          tar -xzvf ${{ secrets.PROJECT_FOLDER }}.zip -C ${{ secrets.PROJECT_FOLDER }}

          cd ${{ secrets.PROJECT_FOLDER }}

          cat > .env << EOF 
            HOST=localhost
            PORT=8080
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=postgres
            DB_USER=postgres
            DB_HOST=db
            DB_PORT=5432
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF
          
          chmod 600 .env

          docker compose up -d

          rm -rf ${{ secrets.PROJECT_FOLDER }}.zip
        "
        rm -rf ${{ secrets.PROJECT_FOLDER }}.zip
        rm key.pem
