<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/404.css">
    <title>Страница не найдена | 404</title>
</head>
<body>
<div class="error-container">
    <div class="error-content">
        <div class="error-code">
            <span class="digit">4</span>
            <span class="zero">
                <svg class="zero-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="60" cy="60" r="50" stroke="currentColor" stroke-width="8" stroke-linecap="round">
                        <animate attributeName="stroke-dasharray" from="0 314" to="314 0" dur="2s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="60" cy="60" r="30" stroke="currentColor" stroke-width="6" stroke-dasharray="100 100" opacity="0.5">
                        <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="4s" repeatCount="indefinite" />
                    </circle>
                </svg>
            </span>
            <span class="digit">4</span>
        </div>
        <h1 class="error-title">Упс! Страница потерялась</h1>
        <p class="error-message">
            Возможно, она была перемещена, удалена или вы ошиблись в адресе.<br>
        </p>
        <div class="action-buttons">
            <a href="/" class="btn btn-primary">На главную</a>
        </div>
    </div>
</div>
<div class="decor-elements">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>
</body>
</html>
