<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="src/style.css" />
  <title>Сокращатель ссылок + QR-код</title>
</head>
<body>
<div class="wrapper">
  <h1>🔗 Сократи и создай QR</h1>

  <div class="input-group">
    <input type="text" id="long-url" class="url-input" placeholder="Вставьте длинную ссылку..." />
    <button id="generate-btn" class="btn">✨ Создать QR‑код</button>
  </div>

  <div class="short-url-group">
    <input type="text" id="short-url" class="short-url-field" readonly placeholder="Короткая ссылка появится здесь" />
    <button id="copy-btn" class="copy-btn">📋 Копировать</button>
  </div>

  <div class="qr-container">
    <img id="qr-image" src="" alt="QR-код будет здесь" />
  </div>
</div>

<script src="src/main.js"></script>
</body>
</html>
